name: Pension360 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: pension360_test
          POSTGRES_USER: pension360
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pension360 -d pension360_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pension360:ci-only-ephemeral-password@127.0.0.1:5432/pension360_test
      NODE_ENV: test
      AI_PROVIDER: disabled
      TZ: Asia/Dubai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:smoke
      - run: npm run test:demo
      - run: npm run test -w apps/web
      - run: npm audit --audit-level=moderate
      - run: docker build --target api -t pension360-api:ci .
