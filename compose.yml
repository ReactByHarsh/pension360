name: pension360
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: pension360
      POSTGRES_USER: pension360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pension360 -d pension360"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: { context: ., target: api }
    image: pension360-api:local
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://pension360:${POSTGRES_PASSWORD}@postgres:5432/pension360
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    image: pension360-api:local
    build: { context: ., target: api }
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://pension360:${POSTGRES_PASSWORD}@postgres:5432/pension360
      SOURCE_ALLOWED_ORIGINS: http://127.0.0.1:4000
      SOURCE_ALLOW_PRIVATE_ORIGINS: http://127.0.0.1:4000
      SOURCE_ALLOW_HTTP_ORIGINS: http://127.0.0.1:4000
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:4000:4000"]
  worker:
    image: pension360-api:local
    command: ["node", "apps/api/dist/worker.js"]
    healthcheck: { disable: true }
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://pension360:${POSTGRES_PASSWORD}@postgres:5432/pension360
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 110s
  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
