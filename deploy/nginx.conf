server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 8m;
    set $external_scheme $scheme;
    # Production mounts an explicit allowlist for the immediate HTTPS ingress.
    include /etc/nginx/pension360-ingress/*.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Monaco and GoRules use local workers/WASM. Set your approved OIDC origin
    # explicitly in connect-src when serving through the production TLS ingress.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location /health/ { proxy_pass http://api:4000; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
